<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>따라하기 — 손으로 하는 기억력 게임</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #17123a; color: #f2eefc; overflow: hidden;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
  }
  canvas { display: block; }

  /* 진단 패널 — 뭐가 잘못됐는지 화면에 바로 보여줍니다 */
  #diag {
    position: fixed; top: 12px; left: 12px; z-index: 20;
    background: rgba(11, 8, 30, 0.86);
    border: 1px solid #4b3d8f; border-radius: 10px;
    padding: 12px 16px; font-size: 13px; line-height: 1.9;
    max-width: 82vw; white-space: pre-wrap;
  }
  #diag b { color: #ffd166; font-weight: 700; }
  .ok   { color: #4ecda4; }
  .bad  { color: #ff7b8f; }
  .warn { color: #ffb84d; }

  #enterVR {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    z-index: 20; padding: 18px 44px;
    font-family: inherit; font-size: 19px; font-weight: 700; color: #17123a;
    background: #ffd166; border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 28px rgba(255, 209, 102, 0.35);
  }
  #enterVR:disabled { background: #4b3d8f; color: #b9aee0; cursor: default; box-shadow: none; }
  #enterVR:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  #hint {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    z-index: 20; font-size: 12px; color: #8d81bb;
  }
</style>
</head>
<body>

<div id="diag">진단 정보를 불러오는 중…</div>
<button id="enterVR" disabled>준비 중…</button>
<div id="hint">PC에서는 마우스로 패드를 클릭해 테스트할 수 있어요</div>

<script>
/* ============================================================
   0. 진단 — 문제가 생기면 화면에 그대로 찍습니다
   ============================================================ */
var lines = {};
function say(key, label, value, cls) {
  lines[key] = '<b>' + label + '</b> <span class="' + (cls || '') + '">' + value + '</span>';
  var out = [];
  for (var k in lines) out.push(lines[k]);
  document.getElementById('diag').innerHTML = out.join('<br>');
}

say('proto', '주소', location.protocol,
    location.protocol === 'https:' || location.hostname === 'localhost' ? 'ok' : 'warn');

if (location.protocol === 'file:') {
  say('proto2', '참고', 'file:// 에서는 헤드셋 접속이 안 됩니다. PC 확인용으로만 쓰세요.', 'warn');
}

window.addEventListener('error', function (e) {
  say('err', '오류', (e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() : ''), 'bad');
});

/* ============================================================
   1. Three.js 로드 — CDN 세 곳을 차례로 시도
   ============================================================ */
var CDNS = [
  'https://unpkg.com/three@0.128.0/build/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
];

function loadThree(i) {
  if (i >= CDNS.length) {
    say('three', 'Three.js', '모든 CDN 실패 — 인터넷 연결이나 네트워크 차단을 확인하세요', 'bad');
    return;
  }
  say('three', 'Three.js', '불러오는 중… (' + (i + 1) + '/' + CDNS.length + ')', 'warn');
  var s = document.createElement('script');
  s.src = CDNS[i];
  s.onload = function () {
    say('three', 'Three.js', '로드됨 (' + THREE.REVISION + ')', 'ok');
    boot();
  };
  s.onerror = function () { loadThree(i + 1); };
  document.head.appendChild(s);
}
loadThree(0);

/* ============================================================
   설정값 — 현장에서 여기만 고치면 됩니다
   ============================================================ */
var CFG = {
  startLevel:   1,      // 시작 레벨 (레벨 번호 = 시퀀스 길이)
  litTime:      0.70,   // 1레벨에서 패드가 켜져 있는 시간(초)
  gapTime:      0.28,   // 1레벨에서 패드 사이 간격(초)
  speedUp:      0.93,   // 레벨당 속도 배율. 작을수록 빨리 어려워짐
  litMin:       0.28,   // 아무리 빨라져도 이보다 짧아지지 않음
  gapMin:       0.11,
  inputTimeout: 7.0,    // 입력 없을 때 자동 종료(초)
  touchRadius:  0.085,  // 손가락 인식 반경(m)
  wandLength:   0.26,   // 컨트롤러에 달린 막대 길이(m). 길면 편하고 짧으면 정확함
  padRadius:    0.46,   // 몸에서 패드까지 거리(m)
  padDrop:      0.42,   // 눈높이 대비 패드 높이 차(m)
  gameOverHold: 4.5,    // 결과 화면 유지 시간(초)
  debug:        true    // VR 안에 입력 상태 패널 표시. 행사 당일엔 false로
};

// 레벨이 오를수록 시퀀스 재생이 빨라집니다
function litTime() {
  return Math.max(CFG.litMin, CFG.litTime * Math.pow(CFG.speedUp, level - 1));
}
function gapTime() {
  return Math.max(CFG.gapMin, CFG.gapTime * Math.pow(CFG.speedUp, level - 1));
}

var COLORS = [0xff5d73, 0xffb84d, 0x4ecda4, 0x4da6ff];
var NOTES  = [523.25, 587.33, 659.25, 783.99];  // C5 D5 E5 G5

var renderer, scene, camera, clock, rig;
var pads = [], startPad, bot = {}, fingerDots = [], hands = [], grips = [];
var hud, sub, dbg, audioCtx = null;
var state = 'WAIT', sequence = [], level = CFG.startLevel;
var playIdx = 0, inputIdx = 0, timer = 0, litPad = -1;
var highScore = 0, calibrated = false, dbgTick = 0;
var _v, _p, ray;

/* ============================================================
   2. 초기화
   ============================================================ */
function boot() {
  _v = new THREE.Vector3();
  _p = new THREE.Vector3();
  ray = new THREE.Raycaster();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x17123a);
  scene.fog = new THREE.Fog(0x17123a, 3, 12);

  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 50);
  camera.position.set(0, 1.45, 0.85);   // PC 테스트용 시점. VR에서는 무시됩니다
  camera.lookAt(0, 1.0, -0.5);

  scene.add(new THREE.HemisphereLight(0xbfa8ff, 0x241a4d, 1.6));
  var key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(1.5, 3, 1.5);
  scene.add(key);

  var grid = new THREE.GridHelper(10, 20, 0x5b4b9e, 0x2f2560);
  grid.material.transparent = true;
  grid.material.opacity = 0.5;
  scene.add(grid);

  rig = new THREE.Group();
  rig.position.set(0, 1.0, 0);
  scene.add(rig);

  buildPads();
  buildBot();
  buildHud();

  for (var i = 0; i < 2; i++) {
    var dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.012, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0xfff4d6 })
    );
    dot.visible = false;
    scene.add(dot);
    fingerDots.push(dot);
  }

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  document.body.appendChild(renderer.domElement);

  for (var j = 0; j < 2; j++) {
    var h = renderer.xr.getHand(j);
    scene.add(h);
    hands.push(h);

    // 컨트롤러 — 끝에 막대와 구슬을 달아 "찌르는 도구"로 씁니다
    var c = renderer.xr.getControllerGrip(j);
    var stick = new THREE.Mesh(
      new THREE.CylinderGeometry(0.008, 0.011, CFG.wandLength, 12),
      new THREE.MeshStandardMaterial({ color: 0xd9cfff, roughness: 0.5 })
    );
    stick.rotation.x = -Math.PI / 2;
    stick.position.z = -CFG.wandLength / 2;
    c.add(stick);

    var tipBall = new THREE.Mesh(
      new THREE.SphereGeometry(0.019, 20, 16),
      new THREE.MeshBasicMaterial({ color: 0xfff4d6 })
    );
    tipBall.position.z = -CFG.wandLength;
    c.add(tipBall);

    scene.add(c);
    grips.push({ obj: c, tip: tipBall });
  }

  clock = new THREE.Clock();
  renderer.setAnimationLoop(loop);
  toWait();

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  renderer.domElement.addEventListener('pointerdown', onPointer);

  setupVRButton();
}

/* ============================================================
   3. VR 진입 버튼 — 직접 만들어서 상태를 그대로 보여줍니다
   ============================================================ */
function setupVRButton() {
  var btn = document.getElementById('enterVR');

  if (!navigator.xr) {
    say('xr', 'WebXR', '이 브라우저는 WebXR을 지원하지 않습니다 (PC 테스트만 가능)', 'warn');
    btn.textContent = 'VR 사용 불가';
    return;
  }

  navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
    if (!ok) {
      say('xr', 'WebXR', 'immersive-vr 세션을 쓸 수 없습니다', 'warn');
      btn.textContent = 'VR 사용 불가';
      return;
    }
    say('xr', 'WebXR', '사용 가능', 'ok');
    btn.disabled = false;
    btn.textContent = 'VR로 시작하기';
    btn.onclick = function () {
      navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
      }).then(function (session) {
        renderer.xr.setSession(session);
        calibrated = false;
        initAudio();
        toWait();
        document.getElementById('diag').style.display = 'none';
        btn.style.display = 'none';
        document.getElementById('hint').style.display = 'none';
        session.addEventListener('end', function () {
          document.getElementById('diag').style.display = '';
          btn.style.display = '';
          document.getElementById('hint').style.display = '';
        });
      }).catch(function (err) {
        say('xr', 'WebXR', '세션 시작 실패: ' + err.message, 'bad');
      });
    };
  }).catch(function (err) {
    say('xr', 'WebXR', '확인 실패: ' + err.message, 'bad');
  });
}

/* ============================================================
   4. 패드 · 캐릭터 · 안내판
   ============================================================ */
function buildPads() {
  var spread = 0.62;
  for (var i = 0; i < 4; i++) {
    var t = (i - 1.5) / 1.5;
    var ang = t * spread;

    var g = new THREE.Group();
    g.position.set(Math.sin(ang) * CFG.padRadius, -t * t * 0.05, -Math.cos(ang) * CFG.padRadius);
    g.rotation.y = -ang;
    g.rotation.x = -0.35;

    var mat = new THREE.MeshStandardMaterial({
      color: COLORS[i], emissive: COLORS[i], emissiveIntensity: 0.18,
      roughness: 0.45, metalness: 0.05
    });
    var face = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.105, 0.035, 32), mat);
    face.rotation.x = Math.PI / 2;
    g.add(face);

    var ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.118, 0.008, 12, 40),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 })
    );
    g.add(ring);

    rig.add(g);
    pads.push({ group: g, mat: mat, ring: ring, touching: false, lit: 0 });
  }

  var sMat = new THREE.MeshStandardMaterial({
    color: 0xffd166, emissive: 0xffd166, emissiveIntensity: 0.6, roughness: 0.4
  });
  var sGroup = new THREE.Group();
  sGroup.position.set(0, 0.02, -CFG.padRadius);
  sGroup.rotation.x = -0.35;
  var sMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.04, 40), sMat);
  sMesh.rotation.x = Math.PI / 2;
  sGroup.add(sMesh);
  rig.add(sGroup);
  startPad = { group: sGroup, mat: sMat, touching: false };
}

function buildBot() {
  var g = new THREE.Group();
  g.position.set(0, 0.42, -CFG.padRadius - 0.16);

  var body = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 32, 24),
    new THREE.MeshStandardMaterial({ color: 0x8b7df0, roughness: 0.5 })
  );
  body.scale.set(1, 0.92, 0.9);
  g.add(body);

  var eyeMat = new THREE.MeshBasicMaterial({ color: 0x1a1436 });
  var eyeX = [-0.048, 0.048];
  for (var i = 0; i < 2; i++) {
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 12), eyeMat);
    eye.position.set(eyeX[i], 0.02, 0.118);
    g.add(eye);
    bot[i === 0 ? 'eyeL' : 'eyeR'] = eye;
  }

  var earMat = new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.6 });
  var earX = [-0.075, 0.075];
  for (var k = 0; k < 2; k++) {
    var ear = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.026, 0.11, 12), earMat);
    ear.position.set(earX[k], 0.13, 0);
    ear.rotation.z = earX[k] < 0 ? 0.32 : -0.32;
    g.add(ear);
  }

  rig.add(g);
  bot.group = g;
  bot.baseY = g.position.y;
}

function makePanel(w, h, px) {
  var c = document.createElement('canvas');
  c.width = px;
  c.height = Math.round(px * h / w);
  var tex = new THREE.CanvasTexture(c);
  var mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  return { canvas: c, ctx: c.getContext('2d'), tex: tex, mesh: mesh };
}

function buildHud() {
  hud = makePanel(0.62, 0.20, 768);
  hud.mesh.position.set(0, 0.44, -CFG.padRadius - 0.02);
  hud.mesh.rotation.x = 0.12;
  rig.add(hud.mesh);

  sub = makePanel(0.52, 0.10, 640);
  sub.mesh.position.set(0, 0.30, -CFG.padRadius - 0.02);
  sub.mesh.rotation.x = 0.12;
  rig.add(sub.mesh);

  // VR 안에서 입력 상태를 확인하는 패널
  dbg = makePanel(0.60, 0.09, 768);
  dbg.mesh.position.set(0, -0.24, -CFG.padRadius + 0.04);
  dbg.mesh.rotation.x = -0.5;
  dbg.mesh.visible = CFG.debug;
  rig.add(dbg.mesh);
}

function drawPanel(p, text, color, size) {
  var ctx = p.ctx, c = p.canvas;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = color || '#f2eefc';
  ctx.font = '700 ' + (size || 96) + "px 'Noto Sans KR', system-ui, sans-serif";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, c.height / 2);
  p.tex.needsUpdate = true;
}

/* ============================================================
   5. 소리
   ============================================================ */
function initAudio() {
  if (audioCtx) { audioCtx.resume(); return; }
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}

function tone(freq, dur, type, gain) {
  if (!audioCtx) return;
  dur = dur || 0.35;
  var t = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var amp = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  amp.gain.setValueAtTime(0, t);
  amp.gain.linearRampToValueAtTime(gain || 0.22, t + 0.02);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(amp);
  amp.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur + 0.05);
}

function chord(freqs) {
  freqs.forEach(function (f, i) { setTimeout(function () { tone(f, 0.45); }, i * 70); });
}

/* ============================================================
   6. 게임 상태
   ============================================================ */
function toWait() {
  state = 'WAIT';
  calibrated = false;   // 다음 사람 자리에 맞춰 다시 배치

  startPad.group.visible = true;
  pads.forEach(function (p) { p.group.visible = false; p.lit = 0; });
  drawPanel(hud, '노란 판을 눌러요', '#ffd166', 84);
  drawPanel(sub, highScore ? '최고 레벨 ' + highScore : '순서를 기억하는 게임', '#b9aee0', 52);
}

function startGame() {
  level = CFG.startLevel;
  sequence = [];
  startPad.group.visible = false;
  pads.forEach(function (p) { p.group.visible = true; });
  nextRound();
}

function nextRound() {
  while (sequence.length < level) {
    var n = Math.floor(Math.random() * 4);
    if (sequence.length && n === sequence[sequence.length - 1]) {
      n = (n + 1 + Math.floor(Math.random() * 3)) % 4;
    }
    sequence.push(n);
  }
  state = 'SHOW';
  playIdx = 0; timer = 0.7; litPad = -1;
  drawPanel(hud, '잘 보세요', '#f2eefc', 84);
  drawPanel(sub, '레벨 ' + level, '#b9aee0', 52);
}

function toInput() {
  state = 'INPUT';
  inputIdx = 0; timer = CFG.inputTimeout;
  drawPanel(hud, '따라 해요', '#4ecda4', 84);
  drawPanel(sub, '레벨 ' + level + '  0 / ' + level, '#b9aee0', 52);
}

function gameOver() {
  state = 'OVER';
  timer = CFG.gameOverHold;
  var score = level - 1;
  var isBest = score > highScore;
  if (isBest) highScore = score;
  pads.forEach(function (p) { p.lit = 0; });
  buzz(1.0, 220);
  tone(150, 0.5, 'sawtooth', 0.18);
  setTimeout(function () { tone(110, 0.7, 'sawtooth', 0.15); }, 130);
  drawPanel(hud, score > 0 ? '레벨 ' + score + '!' : '아쉬워요', '#ffd166', 100);
  drawPanel(sub, isBest && score > 0 ? '최고 기록이에요' : '다시 해볼까요', '#b9aee0', 52);
}

/* ============================================================
   7. 손가락 입력
   ============================================================ */
// three 버전에 따라 joints가 객체이거나 배열입니다. 둘 다 처리합니다.
function indexTip(hand) {
  if (!hand || !hand.joints) return null;
  if (hand.joints['index-finger-tip']) return hand.joints['index-finger-tip'];
  if (hand.joints.length && hand.joints[9]) return hand.joints[9];
  return null;
}

// 손끝과 컨트롤러 막대 끝을 모두 "누르는 점"으로 취급합니다.
// 입력 상태를 이벤트에 기대지 않고 매 프레임 세션에서 직접 읽습니다.
var dbgHands = 0, dbgCtrls = 0, dbgSrcs = 0;

function touchPoints() {
  var out = [];
  var session = renderer.xr.getSession();
  var srcs = (session && session.inputSources) ? session.inputSources : [];
  dbgSrcs = srcs.length;
  dbgHands = 0;
  dbgCtrls = 0;

  // 1) 손가락
  for (var i = 0; i < 2; i++) {
    var joint = indexTip(hands[i]);
    var dot = fingerDots[i];
    var gotHand = false;
    if (joint && joint.visible !== false) {
      joint.getWorldPosition(_v);
      if (_v.lengthSq() > 0.0001) {
        out.push(_v.clone());
        dot.position.copy(_v);
        gotHand = true;
        dbgHands++;
      }
    }
    dot.visible = gotHand;
  }

  // 2) 컨트롤러 막대 끝
  // three의 컨트롤러 배열은 session.inputSources와 같은 순서로 매핑됩니다
  for (var k = 0; k < 2; k++) {
    var g = grips[k];
    if (!g) continue;
    var src = srcs[k];
    var isCtrl = !!(src && !src.hand && src.gripSpace) && g.obj.visible !== false;
    g.obj.visible = isCtrl;
    if (isCtrl) {
      dbgCtrls++;
      g.tip.getWorldPosition(_v);
      out.push(_v.clone());
    }
  }

  return out;
}

// 컨트롤러 진동
function buzz(strength, ms) {
  var session = renderer.xr.getSession();
  if (!session || !session.inputSources) return;
  for (var i = 0; i < session.inputSources.length; i++) {
    var gp = session.inputSources[i].gamepad;
    if (gp && gp.hapticActuators && gp.hapticActuators[0]) {
      try { gp.hapticActuators[0].pulse(strength, ms); } catch (e) {}
    }
  }
}

// 손가락이 새로 들어온 순간만 인식 (나갔다 다시 들어와야 재인식)
function checkTouch(pad, tips) {
  pad.group.getWorldPosition(_p);
  var near = false;
  for (var i = 0; i < tips.length; i++) {
    if (tips[i].distanceTo(_p) < CFG.touchRadius + 0.03) { near = true; break; }
  }
  if (near && !pad.touching) { pad.touching = true; return true; }
  if (!near) pad.touching = false;
  return false;
}

function hitPad(i) {
  pads[i].lit = 1;
  tone(NOTES[i], 0.42);
  buzz(0.5, 45);
  if (sequence[inputIdx] === i) {
    inputIdx++;
    timer = CFG.inputTimeout;
    drawPanel(sub, '레벨 ' + level + '  ' + inputIdx + ' / ' + level, '#b9aee0', 52);
    if (inputIdx >= level) {
      state = 'GOOD';
      timer = 1.2;
      chord([659.25, 783.99, 1046.5]);
      drawPanel(hud, '맞았어요', '#4ecda4', 84);
      drawPanel(sub, '다음 레벨', '#b9aee0', 52);
    }
  } else {
    gameOver();
  }
}

/* ============================================================
   8. 루프
   ============================================================ */
function loop(time) {
  var dt = Math.min(clock.getDelta(), 0.05);
  var t = (time || 0) * 0.001;

  // 서 있는 자리와 바라보는 방향에 맞춰 패드 배치를 통째로 옮깁니다
  if (renderer.xr.isPresenting && !calibrated) {
    var xrCam = renderer.xr.getCamera(camera);
    xrCam.getWorldPosition(_v);
    if (_v.y > 0.5) {
      rig.position.set(_v.x, Math.max(0.55, _v.y - CFG.padDrop), _v.z);
      xrCam.getWorldDirection(_p);
      rig.rotation.y = Math.atan2(-_p.x, -_p.z);
      calibrated = true;
    }
  }

  var tips = renderer.xr.isPresenting ? touchPoints() : [];

  // 입력 상태를 VR 안에 표시
  if (CFG.debug && renderer.xr.isPresenting) {
    dbgTick += dt;
    if (dbgTick > 0.25) {
      dbgTick = 0;
      drawPanel(dbg,
        '입력 ' + dbgSrcs + ' · 컨트롤러 ' + dbgCtrls + ' · 손 ' + dbgHands + ' · 점 ' + tips.length,
        tips.length > 0 ? '#4ecda4' : '#ff7b8f', 46);
    }
  }

  if (state === 'WAIT') {
    startPad.mat.emissiveIntensity = 0.45 + Math.sin(t * 3) * 0.25;
    if (checkTouch(startPad, tips)) { tone(880, 0.3); buzz(0.6, 80); startGame(); }

  } else if (state === 'SHOW') {
    timer -= dt;
    if (timer <= 0) {
      if (litPad >= 0) {
        litPad = -1;
        timer = gapTime();
        if (playIdx >= level) toInput();
      } else {
        var lt = litTime();
        litPad = sequence[playIdx];
        pads[litPad].lit = 1;
        tone(NOTES[litPad], lt * 0.9);
        bot.group.position.y = bot.baseY - 0.03;
        playIdx++;
        timer = lt;
      }
    }

  } else if (state === 'INPUT') {
    timer -= dt;
    if (timer <= 0) {
      gameOver();
    } else {
      for (var i = 0; i < 4; i++) {
        if (checkTouch(pads[i], tips)) { hitPad(i); break; }
      }
    }

  } else if (state === 'GOOD') {
    timer -= dt;
    if (timer <= 0) { level++; nextRound(); }

  } else if (state === 'OVER') {
    timer -= dt;
    if (timer <= 0) toWait();
  }

  for (var k = 0; k < 4; k++) {
    var p = pads[k];
    p.lit = Math.max(0, p.lit - dt * 3.2);
    p.mat.emissiveIntensity = 0.18 + p.lit * 1.5;
    p.group.scale.setScalar(1 + p.lit * 0.09);
    p.ring.material.opacity = 0.25 + p.lit * 0.6;
  }

  bot.group.position.y += (bot.baseY - bot.group.position.y) * Math.min(1, dt * 8);
  bot.group.rotation.z = Math.sin(t * 1.4) * 0.06;
  var blink = Math.sin(t * 0.8) > 0.985 ? 0.15 : 1;
  bot.eyeL.scale.y = blink;
  bot.eyeR.scale.y = blink;

  renderer.render(scene, camera);
}

/* ============================================================
   9. PC 테스트 — 마우스로 패드 클릭
   ============================================================ */
function onPointer(e) {
  if (renderer.xr.isPresenting) return;
  initAudio();
  var m = new THREE.Vector2(
    (e.clientX / innerWidth) * 2 - 1,
    -(e.clientY / innerHeight) * 2 + 1
  );
  ray.setFromCamera(m, camera);
  if (state === 'WAIT') {
    if (ray.intersectObject(startPad.group, true).length) { tone(880, 0.3); startGame(); }
    return;
  }
  if (state !== 'INPUT') return;
  for (var i = 0; i < 4; i++) {
    if (ray.intersectObject(pads[i].group, true).length) { hitPad(i); return; }
  }
}
</script>
