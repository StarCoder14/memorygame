<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>따라하기 — 기억력 게임</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14121c; color: #f2eefc; overflow: hidden;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
  }
  canvas { display: block; }
  #diag {
    position: fixed; top: 12px; left: 12px; z-index: 20;
    background: rgba(11, 8, 30, 0.86);
    border: 1px solid #4b3d8f; border-radius: 10px;
    padding: 12px 16px; font-size: 13px; line-height: 1.9;
    max-width: 82vw; white-space: pre-wrap;
  }
  #diag b { color: #ffd166; font-weight: 700; }
  .ok { color: #4ecda4; } .bad { color: #ff7b8f; } .warn { color: #ffb84d; }
  #enterVR {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    z-index: 20; padding: 18px 44px;
    font-family: inherit; font-size: 19px; font-weight: 700; color: #17123a;
    background: #ffd166; border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 28px rgba(255, 209, 102, 0.35);
  }
  #enterVR:disabled { background: #4b3d8f; color: #b9aee0; cursor: default; box-shadow: none; }
  #hint {
    position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
    z-index: 20; font-size: 12px; color: #8d81bb;
  }
</style>
</head>
<body>

<div id="diag">진단 정보를 불러오는 중…</div>
<button id="enterVR" disabled>준비 중…</button>
<div id="hint">PC에서는 마우스로 버튼을 클릭해 테스트할 수 있어요</div>

<script>
/* ============================================================
   0. 진단
   ============================================================ */
var lines = {};
function say(key, label, value, cls) {
  lines[key] = '<b>' + label + '</b> <span class="' + (cls || '') + '">' + value + '</span>';
  var out = [];
  for (var k in lines) out.push(lines[k]);
  document.getElementById('diag').innerHTML = out.join('<br>');
}
say('proto', '주소', location.protocol,
    location.protocol === 'https:' || location.hostname === 'localhost' ? 'ok' : 'warn');
window.addEventListener('error', function (e) {
  say('err', '오류', (e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() : ''), 'bad');
});

/* ============================================================
   1. Three.js 로드
   ============================================================ */
var CDNS = [
  'https://unpkg.com/three@0.128.0/build/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
];
function loadThree(i) {
  if (i >= CDNS.length) { say('three', 'Three.js', '모든 CDN 실패', 'bad'); return; }
  say('three', 'Three.js', '불러오는 중… (' + (i + 1) + '/' + CDNS.length + ')', 'warn');
  var s = document.createElement('script');
  s.src = CDNS[i];
  s.onload = function () { say('three', 'Three.js', '로드됨 (' + THREE.REVISION + ')', 'ok'); boot(); };
  s.onerror = function () { loadThree(i + 1); };
  document.head.appendChild(s);
}
loadThree(0);

/* ============================================================
   설정값
   ============================================================ */
var CFG = {
  ringRadius:   0.62,
  tierHeight:   0.28,
  padTilt:      0.40,
  padTiltUpper: 0.15,
  spawnTime:    0.75,
  spawnDrop:    0.85,

  descStart:    2.35,   // 캐릭터가 내려오기 시작하는 높이 (눈높이 기준 위쪽, m)
  descEnd:      0.52,   // 여기까지 내려오면 끝
  speedGrow:    0.055,  // 레벨당 하강 속도 증가율

  touchRadius:  0.085,
  wandLength:   0.26,
  padDrop:      0.42,
  refEyeHeight: 1.55,
  minScale:     0.70,
  maxScale:     1.12,
  gameOverHold: 5.0,
  settleTime:   1.0,
  debug:        true
};

// 난이도 3종 — 아래 숫자는 4000회 플레이 시뮬레이션으로 맞춘 값입니다.
// 어느 난이도든 대략 45~90초에 끝나도록 조정돼 있습니다 (부스 회전율 기준).
var DIFFS = [
  { key:'easy',   name:'쉬움',   color:0x3ecf8e,
    startPads:4, speed:0.055, step:0.12, wrongDrop:0.16, wrongMul:1.08,
    expandEvery:8, lit:0.80, gap:0.32, inputTimeout:9.0, interfere:false },
  { key:'normal', name:'보통',   color:0xffc93c,
    startPads:6, speed:0.055, step:0.13, wrongDrop:0.26, wrongMul:1.16,
    expandEvery:6, lit:0.62, gap:0.24, inputTimeout:8.0, interfere:false },
  { key:'hard',   name:'어려움', color:0xff5d5d,
    startPads:8, speed:0.050, step:0.12, wrongDrop:0.34, wrongMul:1.22,
    expandEvery:5, lit:0.48, gap:0.17, inputTimeout:7.0, interfere:true }
];

var HUES = [
  0xd0a8ff, 0xa8b400, 0x0e7f8f, 0x33a8ff,
  0x00cfc4, 0xff3b30, 0xff7b5a, 0xff8c1a,
  0xb0713c, 0xeef1f7, 0xa855f7, 0xff4fb0,
  0x2f4fd6, 0xffd60a, 0x17a34a, 0x8fe121
];

var NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25,
             783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00];

// 다섯 동물. 어려움에서는 각자의 방해 능력이 발동합니다
var ANIMALS = [
  { key:'rabbit', name:'토끼',   fur:0xf0e2da, accent:0xffb3c7, ear:'long',  tail:'puff',
    power:'fast',  hint:'순서가 빨라져요' },
  { key:'bear',   name:'곰',     fur:0xa9764b, accent:0xe4cba6, ear:'round', tail:'none',
    power:'block', hint:'풍선이 앞을 가려요' },
  { key:'fox',    name:'여우',   fur:0xe8823c, accent:0xfff0e2, ear:'point', tail:'long',
    power:'mute',  hint:'소리가 안 나요' },
  { key:'cat',    name:'고양이', fur:0x9a9cab, accent:0xf2f2f8, ear:'point', tail:'long',
    power:'spin',  hint:'버튼이 돌아가요' },
  { key:'owl',    name:'부엉이', fur:0x9a7fc4, accent:0xffe2a8, ear:'tuft',  tail:'none',
    power:'dark',  hint:'조명이 어두워져요' }
];

var renderer, scene, camera, clock, rig, padRing;
var pads = [], diffPads = [], bot = null, fingerDots = [], hands = [], grips = [];
var hud, sub, dbg, audioCtx = null, metalMat, darkMat;
var envLights = {}, balloon = null;
var state = 'SELECT', sequence = [], level = 1;
var playIdx = 0, inputIdx = 0, timer = 0, litPad = -1;
var best = { easy: 0, normal: 0, hard: 0 }, calibrated = false, settle = 0, dbgTick = 0;
var padCount = 4, D = DIFFS[1], animal = null, animalMesh = null;
var descY = 0, descMul = 1, descKick = 0, rope = null, descGroup = null;
var spinAmt = 0, darkAmt = 0, blockT = -1;
var _v, _p, _q, ray;

function padsForLevel(lv) { return Math.min(16, D.startPads + 4 * Math.floor((lv - 1) / D.expandEvery)); }
function descSpeed() { return D.speed * (1 + (level - 1) * CFG.speedGrow) * descMul; }
function litTime() { return D.lit * (animal && D.interfere && animal.power === 'fast' ? 0.70 : 1); }
function gapTime() { return D.gap * (animal && D.interfere && animal.power === 'fast' ? 0.70 : 1); }
function muted()   { return !!(animal && D.interfere && animal.power === 'mute'); }

/* ============================================================
   2. 초기화
   ============================================================ */
function boot() {
  _v = new THREE.Vector3(); _p = new THREE.Vector3();
  _q = new THREE.Quaternion(); ray = new THREE.Raycaster();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14121c);
  scene.fog = new THREE.Fog(0x14121c, 5, 17);

  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 60);
  camera.position.set(0, 1.55, 1.9);
  camera.lookAt(0, 1.15, -0.4);

  metalMat = new THREE.MeshStandardMaterial({ color: 0x8f95a8, roughness: 0.42, metalness: 0.75 });
  darkMat  = new THREE.MeshStandardMaterial({ color: 0x22242e, roughness: 0.7,  metalness: 0.35 });

  buildEnvironment();

  rig = new THREE.Group();
  rig.position.set(0, 1.0, 0);
  scene.add(rig);

  padRing = new THREE.Group();       // 고양이의 '회전' 방해는 이 그룹만 돌립니다
  rig.add(padRing);

  buildPads();
  buildDiffButtons();
  buildDescender();
  buildHud();
  buildBalloon();
  fitPoles();

  for (var i = 0; i < 2; i++) {
    var dot = new THREE.Mesh(new THREE.SphereGeometry(0.012, 16, 12),
                             new THREE.MeshBasicMaterial({ color: 0xfff4d6 }));
    dot.visible = false;
    scene.add(dot);
    fingerDots.push(dot);
  }

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  document.body.appendChild(renderer.domElement);

  for (var j = 0; j < 2; j++) {
    var h = renderer.xr.getHand(j); scene.add(h); hands.push(h);
    var c = renderer.xr.getControllerGrip(j);
    var stick = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.011, CFG.wandLength, 12), metalMat);
    stick.rotation.x = -Math.PI / 2; stick.position.z = -CFG.wandLength / 2; c.add(stick);
    var tipBall = new THREE.Mesh(new THREE.SphereGeometry(0.019, 20, 16),
                                 new THREE.MeshBasicMaterial({ color: 0xfff4d6 }));
    tipBall.position.z = -CFG.wandLength; c.add(tipBall);
    scene.add(c);
    grips.push({ obj: c, tip: tipBall });
  }

  clock = new THREE.Clock();
  renderer.setAnimationLoop(loop);
  toSelect();

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  renderer.domElement.addEventListener('pointerdown', onPointer);
  setupVRButton();
}

function setupVRButton() {
  var btn = document.getElementById('enterVR');
  if (!navigator.xr) { say('xr','WebXR','미지원','warn'); btn.textContent='VR 사용 불가'; return; }
  navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
    if (!ok) { say('xr','WebXR','사용 불가','warn'); btn.textContent='VR 사용 불가'; return; }
    say('xr', 'WebXR', '사용 가능', 'ok');
    btn.disabled = false; btn.textContent = 'VR로 시작하기';
    btn.onclick = function () {
      navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
      }).then(function (session) {
        renderer.xr.setSession(session);
        initAudio(); toSelect();
        document.getElementById('diag').style.display = 'none';
        btn.style.display = 'none';
        document.getElementById('hint').style.display = 'none';
        session.addEventListener('end', function () {
          document.getElementById('diag').style.display = '';
          btn.style.display = '';
          document.getElementById('hint').style.display = '';
        });
      }).catch(function (err) { say('xr','WebXR','세션 실패: '+err.message,'bad'); });
    };
  });
}

/* ============================================================
   3. 배경
   ============================================================ */
function concreteTexture() {
  var c = document.createElement('canvas'); c.width = c.height = 512;
  var x = c.getContext('2d');
  x.fillStyle = '#585c68'; x.fillRect(0, 0, 512, 512);
  for (var b = 0; b < 40; b++) {
    var r = 40 + Math.random() * 110;
    var g = x.createRadialGradient(Math.random()*512, Math.random()*512, 0,
                                   Math.random()*512, Math.random()*512, r);
    var tint = Math.random() > 0.5 ? '255,255,255' : '20,22,30';
    g.addColorStop(0, 'rgba(' + tint + ',0.055)'); g.addColorStop(1, 'rgba(' + tint + ',0)');
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
  }
  for (var i = 0; i < 16000; i++) {
    var v = 60 + Math.random() * 60;
    x.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 8) + ',0.35)';
    x.fillRect(Math.random()*512, Math.random()*512, 1.6, 1.6);
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(7, 7);
  return tex;
}
function wallTexture() {
  var c = document.createElement('canvas'); c.width = 16; c.height = 256;
  var x = c.getContext('2d');
  var g = x.createLinearGradient(0, 256, 0, 0);
  g.addColorStop(0.00, '#3c3f4d'); g.addColorStop(0.35, '#2a2c38'); g.addColorStop(1.00, '#14151d');
  x.fillStyle = g; x.fillRect(0, 0, 16, 256);
  return new THREE.CanvasTexture(c);
}
function glowTexture() {
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var x = c.getContext('2d');
  var g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,246,220,0.55)');
  g.addColorStop(0.5, 'rgba(255,240,200,0.16)');
  g.addColorStop(1, 'rgba(255,240,200,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
function buildEnvironment() {
  envLights.hemi = new THREE.HemisphereLight(0xc9d4ff, 0x2a2620, 0.75);
  scene.add(envLights.hemi);
  envLights.key = new THREE.DirectionalLight(0xfff2dc, 1.15);
  envLights.key.position.set(2.5, 6, 1.5); scene.add(envLights.key);
  envLights.fill = new THREE.DirectionalLight(0x9fb4ff, 0.35);
  envLights.fill.position.set(-3, 2, -3); scene.add(envLights.fill);
  envLights.baseHemi = 0.75; envLights.baseKey = 1.15; envLights.baseFill = 0.35;

  var floor = new THREE.Mesh(new THREE.CircleGeometry(11, 56),
    new THREE.MeshStandardMaterial({ map: concreteTexture(), color: 0xb8bdc9,
                                     roughness: 0.88, metalness: 0.06 }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);

  var wall = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 5.5, 44, 1, true),
    new THREE.MeshBasicMaterial({ map: wallTexture(), side: THREE.BackSide }));
  wall.position.y = 2.75; scene.add(wall);

  var ceil = new THREE.Mesh(new THREE.CircleGeometry(11, 56),
    new THREE.MeshBasicMaterial({ color: 0x101119 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.y = 5.5; scene.add(ceil);

  var lampMat = new THREE.MeshBasicMaterial({ color: 0xfff4dc });
  for (var i = 0; i < 4; i++) {
    var a = i * Math.PI / 2 + Math.PI / 4;
    var lamp = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.3), lampMat);
    lamp.position.set(Math.sin(a)*2.6, 5.44, Math.cos(a)*2.6);
    lamp.rotation.x = Math.PI / 2; lamp.rotation.z = -a;
    scene.add(lamp);
  }

  var pool = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 4.4),
    new THREE.MeshBasicMaterial({ map: glowTexture(), transparent: true,
                                  blending: THREE.AdditiveBlending, depthWrite: false }));
  pool.rotation.x = -Math.PI / 2; pool.position.y = 0.012; scene.add(pool);
}

/* ============================================================
   4. 동물 캐릭터 — 도형만으로 만든 이족보행 형태
   전체 높이 약 1.0. 필요한 크기로 scale 해서 씁니다
   ============================================================ */
function limb(mat, rTop, rBot, len) {
  var g = new THREE.Group();
  var m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, len, 12), mat);
  m.position.y = -len / 2;
  g.add(m);
  var joint = new THREE.Mesh(new THREE.SphereGeometry(rTop * 1.05, 12, 10), mat);
  g.add(joint);
  return { group: g, len: len };
}

function buildAnimal(spec) {
  var g = new THREE.Group();
  var fur  = new THREE.MeshStandardMaterial({ color: spec.fur, roughness: 0.82, metalness: 0.02 });
  var acc  = new THREE.MeshStandardMaterial({ color: spec.accent, roughness: 0.78, metalness: 0.02 });
  var dark = new THREE.MeshBasicMaterial({ color: 0x1b1724 });
  var white= new THREE.MeshBasicMaterial({ color: 0xffffff });
  var P = { legs: [], arms: [], ears: [] };

  // 다리
  for (var s = 0; s < 2; s++) {
    var sx = s === 0 ? -1 : 1;
    var L = limb(fur, 0.052, 0.044, 0.28);
    L.group.position.set(0.082 * sx, 0.30, 0);
    var foot = new THREE.Mesh(new THREE.SphereGeometry(0.062, 14, 10), acc);
    foot.scale.set(1.05, 0.5, 1.6); foot.position.set(0, -0.28, 0.03);
    L.group.add(foot);
    g.add(L.group); P.legs.push(L.group);
  }

  // 몸통
  var torso = new THREE.Mesh(new THREE.SphereGeometry(0.155, 24, 20), fur);
  torso.scale.set(1.0, 1.18, 0.84); torso.position.y = 0.46;
  g.add(torso); P.torso = torso;

  var belly = new THREE.Mesh(new THREE.SphereGeometry(0.115, 20, 16), acc);
  belly.scale.set(1.0, 1.12, 0.62); belly.position.set(0, 0.44, 0.075);
  g.add(belly);

  // 팔
  for (var a = 0; a < 2; a++) {
    var ax = a === 0 ? -1 : 1;
    var A = limb(fur, 0.042, 0.034, 0.25);
    A.group.position.set(0.162 * ax, 0.60, 0);
    A.group.rotation.z = 0.16 * ax;
    var hand = new THREE.Mesh(new THREE.SphereGeometry(0.048, 14, 12), acc);
    hand.position.y = -0.25; A.group.add(hand);
    g.add(A.group); P.arms.push(A.group);
  }

  // 머리
  var head = new THREE.Group();
  head.position.y = 0.755;
  g.add(head); P.head = head;

  var skull = new THREE.Mesh(new THREE.SphereGeometry(0.145, 26, 20), fur);
  skull.scale.set(1.0, 0.96, 0.95);
  head.add(skull);

  // 주둥이
  if (spec.ear !== 'tuft') {
    var muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.072, 18, 14), acc);
    muzzle.scale.set(1.0, 0.78, spec.ear === 'point' ? 1.5 : 1.05);
    muzzle.position.set(0, -0.042, 0.115);
    head.add(muzzle);
    var nose = new THREE.Mesh(new THREE.SphereGeometry(0.023, 12, 10), dark);
    nose.scale.set(1.3, 0.9, 0.9);
    nose.position.set(0, -0.018, spec.ear === 'point' ? 0.222 : 0.178);
    head.add(nose);
  } else {
    var beak = new THREE.Mesh(new THREE.ConeGeometry(0.036, 0.075, 4), acc);
    beak.rotation.x = Math.PI / 2; beak.rotation.z = Math.PI / 4;
    beak.position.set(0, -0.025, 0.145);
    head.add(beak);
  }

  // 눈
  for (var e = 0; e < 2; e++) {
    var ex = e === 0 ? -1 : 1;
    var socket = new THREE.Mesh(new THREE.SphereGeometry(0.044, 14, 12),
                                spec.ear === 'tuft' ? acc : white);
    socket.position.set(0.056 * ex, 0.028, 0.108);
    socket.scale.set(1, 1, 0.6);
    head.add(socket);
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.024, 14, 12), dark);
    eye.position.set(0.058 * ex, 0.028, 0.132);
    head.add(eye);
    var spark = new THREE.Mesh(new THREE.SphereGeometry(0.008, 8, 8), white);
    spark.position.set(0.068 * ex, 0.042, 0.148);
    head.add(spark);
    P['eye' + (e === 0 ? 'L' : 'R')] = eye;
    P['sock' + (e === 0 ? 'L' : 'R')] = socket;
  }

  // 귀
  for (var r = 0; r < 2; r++) {
    var rx = r === 0 ? -1 : 1;
    var ear = new THREE.Group();
    ear.position.set(0.072 * rx, 0.115, -0.005);
    if (spec.ear === 'long') {
      var e1 = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.034, 0.26, 12), fur);
      e1.position.y = 0.13; ear.add(e1);
      var e2 = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.021, 0.20, 10), acc);
      e2.position.set(0, 0.13, 0.022); ear.add(e2);
      ear.rotation.z = 0.14 * rx;
    } else if (spec.ear === 'round') {
      var b1 = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), fur);
      b1.scale.set(1, 1, 0.55); b1.position.y = 0.035; ear.add(b1);
      var b2 = new THREE.Mesh(new THREE.SphereGeometry(0.033, 14, 10), acc);
      b2.scale.set(1, 1, 0.5); b2.position.set(0, 0.035, 0.022); ear.add(b2);
      ear.position.x = 0.098 * rx;
    } else if (spec.ear === 'point') {
      var c1 = new THREE.Mesh(new THREE.ConeGeometry(0.048, 0.13, 4), fur);
      c1.position.y = 0.065; c1.rotation.y = Math.PI / 4; ear.add(c1);
      var c2 = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.085, 4), acc);
      c2.position.set(0, 0.055, 0.018); c2.rotation.y = Math.PI / 4; ear.add(c2);
      ear.rotation.z = 0.2 * rx;
    } else {  // tuft — 부엉이 깃뿔
      var t1 = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.1, 5), fur);
      t1.position.y = 0.05; t1.rotation.z = 0.35 * rx; ear.add(t1);
      ear.position.x = 0.062 * rx;
    }
    head.add(ear); P.ears.push(ear);
  }

  // 꼬리
  if (spec.tail === 'puff') {
    var pf = new THREE.Mesh(new THREE.SphereGeometry(0.055, 14, 12), acc);
    pf.position.set(0, 0.38, -0.16); g.add(pf); P.tail = pf;
  } else if (spec.tail === 'long') {
    var tl = new THREE.Group();
    tl.position.set(0, 0.36, -0.13);
    var seg = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.018, 0.28, 10), fur);
    seg.position.y = 0.1; seg.rotation.x = -0.5; tl.add(seg);
    var tip = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 10), acc);
    tip.position.set(0, 0.22, -0.1); tl.add(tip);
    g.add(tl); P.tail = tl;
  }

  g.userData.parts = P;
  g.userData.spec = spec;
  return g;
}

// 캐릭터를 가만두지 않고 살아있게 만듭니다
function animateAnimal(obj, t, mood) {
  if (!obj) return;
  var P = obj.userData.parts;
  var sp = mood === 'panic' ? 7.0 : 2.2;
  var amp = mood === 'panic' ? 0.55 : 0.22;

  P.torso.position.y = 0.46 + Math.sin(t * sp) * 0.012;
  P.head.rotation.z = Math.sin(t * sp * 0.7) * 0.07;
  P.head.rotation.x = Math.sin(t * sp * 0.5) * 0.05;

  for (var i = 0; i < P.arms.length; i++) {
    var s = i === 0 ? -1 : 1;
    P.arms[i].rotation.x = Math.sin(t * sp + i * Math.PI) * amp;
    P.arms[i].rotation.z = (0.16 + Math.abs(Math.sin(t * sp * 0.5)) * 0.1) * s;
  }
  for (var j = 0; j < P.legs.length; j++) {
    P.legs[j].rotation.x = Math.sin(t * sp + j * Math.PI) * amp * 0.7;
  }
  for (var k = 0; k < P.ears.length; k++) {
    P.ears[k].rotation.x = Math.sin(t * sp * 1.3 + k) * 0.12;
  }
  if (P.tail) P.tail.rotation.z = Math.sin(t * sp * 0.9) * 0.25;

  var blink = Math.sin(t * 0.9) > 0.97 ? 0.12 : 1;
  P.sockL.scale.y = P.sockR.scale.y = blink;
  P.eyeL.scale.y = P.eyeR.scale.y = blink;
}

function makeButton(col, radius, tilt, big) {

// 난이도 버튼 3개 — 정면에 나란히
function buildDiffButtons() {

function fitPoles() {
  var sc = rig.scale.y || 1;
  var floorLocal = -rig.position.y / sc;
  var ARM = 0.13;
  for (var i = 0; i < 16; i++) {
    var p = pads[i];
    var len = Math.max(0.25, p.slot.y - floorLocal);
    p.pole.scale.y = len;
    p.pole.position.set(0, p.slot.y - len / 2, ARM);
    p.base.position.set(0, p.slot.y - len + 0.012, ARM);
  }
  var dl = Math.max(0.25, -floorLocal);
  for (var k = 0; k < 3; k++) {
    diffPads[k].pole.scale.y = dl;
    diffPads[k].pole.position.set(0, -dl / 2, ARM);
    diffPads[k].base.position.set(0, -dl + 0.012, ARM);
  }
}

function showPads(n) {
  for (var i = 0; i < 16; i++) {
    var p = pads[i];
    var on = i < n;
    if (on && !p.shown) { p.spawn = -0.11 * (i % 4); p.rang = false; }
    if (!on) { p.lit = 0; p.beam.material.opacity = 0; p.glow.material.opacity = 0; }
    p.shown = on;
    p.unit.visible = on;
  }
}
function showDiff(on) {
  for (var i = 0; i < 3; i++) diffPads[i].unit.visible = on;
}

function makePanel(w, h, px) {

    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));

}
function drawPanel(p, text, color, size) {
  var ctx = p.ctx, c = p.canvas;
  ctx.clearRect(0, 0, c.width, c.height);
  var r = c.height * 0.28, w = c.width, h = c.height;
  ctx.fillStyle = 'rgba(12,12,20,0.62)';
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.arcTo(w,0,w,h,r); ctx.arcTo(w,h,0,h,r);
  ctx.arcTo(0,h,0,0,r); ctx.arcTo(0,0,w,0,r); ctx.closePath(); ctx.fill();
  ctx.fillStyle = color || '#f2eefc';
  ctx.font = '700 ' + (size || 96) + "px 'Noto Sans KR', system-ui, sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2);

}

/* ============================================================
   8. 소리
   ============================================================ */
function initAudio() {
  if (audioCtx) { audioCtx.resume(); return; }
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function tone(freq, dur, type, gain) {
  if (!audioCtx) return;
  dur = dur || 0.35;
  var t = audioCtx.currentTime;
  var osc = audioCtx.createOscillator(), amp = audioCtx.createGain();
  osc.type = type || 'sine'; osc.frequency.value = freq;
  amp.gain.setValueAtTime(0, t);
  amp.gain.linearRampToValueAtTime(gain || 0.22, t + 0.02);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(amp); amp.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur + 0.05);
}
function riseSound(freq) {
  if (!audioCtx) return;
  var t = audioCtx.currentTime;
  var osc = audioCtx.createOscillator(), amp = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq * 0.5, t);
  osc.frequency.exponentialRampToValueAtTime(freq, t + 0.35);
  amp.gain.setValueAtTime(0, t);
  amp.gain.linearRampToValueAtTime(0.16, t + 0.05);
  amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  osc.connect(amp); amp.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.55);
}
function chord(freqs) {
  freqs.forEach(function (f, i) { setTimeout(function () { tone(f, 0.45); }, i * 70); });
}

function toSelect() {
  state = 'SELECT';
  calibrated = false; settle = CFG.settleTime;
  showPads(0); showDiff(true);
  descGroup.visible = false;
  padRing.rotation.y = 0; spinAmt = 0;
  balloon.visible = false;
  resetLights();
  drawPanel(hud, '난이도를 골라요', '#ffd166', 92);
  var anyBest = best.easy || best.normal || best.hard;
  drawPanel(sub, anyBest
    ? '최고 기록  쉬움 ' + best.easy + ' · 보통 ' + best.normal + ' · 어려움 ' + best.hard
    : '순서를 기억해서 따라 하세요', '#b9aee0', anyBest ? 42 : 56);
}

function startGame(diff) {
  D = diff;
  level = 1;
  sequence = [];
  padCount = padsForLevel(level);
  descY = CFG.descStart;
  descMul = 1;
  descKick = 0;
  showDiff(false);
  showPads(padCount);
  descGroup.visible = true;
  setAnimal(ANIMALS[Math.floor(Math.random() * ANIMALS.length)]);
  growSequence();
  state = 'INTRO';
  timer = 2.2;
  drawPanel(hud, animal.name + '이 내려와요', '#ffd166', 88);
  drawPanel(sub, D.interfere ? animal.hint : '버튼을 맞히면 다시 올라가요', '#b9aee0', 52);
  chord([523.25, 659.25, 783.99]);
}

function growSequence() {
  var n = Math.floor(Math.random() * padCount);
  if (sequence.length && n === sequence[sequence.length - 1]) {
    n = (n + 1 + Math.floor(Math.random() * (padCount - 1))) % padCount;
  }
  sequence.push(n);
}

function nextRound() {
  level++;
  var want = padsForLevel(level);
  if (want > padCount) {
    // 버튼이 늘어나면 패턴을 처음부터 다시 외웁니다
    padCount = want;
    sequence = [];
    showPads(padCount);
    setAnimal(ANIMALS[Math.floor(Math.random() * ANIMALS.length)]);
    growSequence();
    state = 'EXPAND';
    timer = 2.4;
    drawPanel(hud, '버튼 ' + padCount + '개!', '#ffd166', 92);
    drawPanel(sub, D.interfere ? animal.name + ' — ' + animal.hint : '순서가 처음부터 다시 시작돼요', '#b9aee0', 50);
    chord([392, 523.25, 659.25, 783.99]);
    return;
  }
  growSequence();
  beginShow();
}

function beginShow() {
  state = 'SHOW';
  playIdx = 0; timer = 0.7; litPad = -1;
  padRing.rotation.y = 0; spinAmt = 0;
  if (D.interfere && animal.power === 'block') blockT = 0;
  drawPanel(hud, '잘 보세요', '#f2eefc', 92);
  drawPanel(sub, '레벨 ' + level + '   버튼 ' + padCount + '개', '#b9aee0', 52);
}

function toInput() {
  state = 'INPUT';
  inputIdx = 0; timer = D.inputTimeout;
  blockT = -1; balloon.visible = false;
  resetLights();
  drawPanel(hud, '따라 해요', '#4ecda4', 92);
  drawPanel(sub, '0 / ' + sequence.length, '#b9aee0', 56);
}

function gameOver(caught) {
  state = 'OVER';
  timer = CFG.gameOverHold;
  for (var i = 0; i < 16; i++) pads[i].lit = 0;
  balloon.visible = false;
  resetLights();
  buzz(1.0, 220);
  tone(180, 0.5, 'triangle', 0.16);
  setTimeout(function () { tone(140, 0.7, 'triangle', 0.14); }, 140);
  var score = level - 1;
  var isBest = score > best[D.key];
  if (isBest) best[D.key] = score;
  drawPanel(hud, score > 0 ? '레벨 ' + score + '!' : '아쉬워요', '#ffd166', 104);
  drawPanel(sub, caught ? animal.name + '한테 잡혔어요' :
    (isBest && score > 0 ? D.name + ' 최고 기록이에요' : '다시 해볼까요'), '#b9aee0', 52);
}

function resetLights() {
  darkAmt = 0;
  envLights.hemi.intensity = envLights.baseHemi;
  envLights.key.intensity = envLights.baseKey;
  envLights.fill.intensity = envLights.baseFill;
}

/* ============================================================
   10. 입력
   ============================================================ */
function indexTip(hand) {
  if (!hand || !hand.joints) return null;
  if (hand.joints['index-finger-tip']) return hand.joints['index-finger-tip'];
  if (hand.joints.length && hand.joints[9]) return hand.joints[9];
  return null;
}
var dbgHands = 0, dbgCtrls = 0, dbgSrcs = 0;

function touchPoints() {
  var out = [];
  var session = renderer.xr.getSession();
  var srcs = (session && session.inputSources) ? session.inputSources : [];
  dbgSrcs = srcs.length; dbgHands = 0; dbgCtrls = 0;
  for (var i = 0; i < 2; i++) {
    var joint = indexTip(hands[i]); var dot = fingerDots[i]; var got = false;
    if (joint && joint.visible !== false) {
      joint.getWorldPosition(_v);
      if (_v.lengthSq() > 0.0001) { out.push(_v.clone()); dot.position.copy(_v); got = true; dbgHands++; }
    }
    dot.visible = got;
  }
  for (var k = 0; k < 2; k++) {
    var g = grips[k]; if (!g) continue;
    var src = srcs[k];
    var isCtrl = !!(src && !src.hand && src.gripSpace) && g.obj.visible !== false;
    g.obj.visible = isCtrl;
    if (isCtrl) { dbgCtrls++; g.tip.getWorldPosition(_v); out.push(_v.clone()); }
  }
  return out;
}
function buzz(strength, ms) {
  var session = renderer.xr.getSession();
  if (!session || !session.inputSources) return;
  for (var i = 0; i < session.inputSources.length; i++) {
    var gp = session.inputSources[i].gamepad;
    if (gp && gp.hapticActuators && gp.hapticActuators[0]) {
      try { gp.hapticActuators[0].pulse(strength, ms); } catch (e) {}
    }
  }
}
function checkTouch(pad, tips) {
  pad.group.getWorldPosition(_p);
  var near = false;
  for (var i = 0; i < tips.length; i++) {
    if (tips[i].distanceTo(_p) < CFG.touchRadius + 0.03) { near = true; break; }
  }
  if (near && !pad.touching) { pad.touching = true; return true; }
  if (!near) pad.touching = false;
  return false;
}

function hitPad(i) {
  pads[i].lit = 1; pads[i].press = 1;
  if (!muted()) tone(NOTES[i], 0.42);
  buzz(0.5, 45);

  if (sequence[inputIdx] === i) {
    inputIdx++;
    timer = D.inputTimeout;
    descY = Math.min(CFG.descStart, descY + D.step);      // 맞히면 뒤로 올라갑니다
    descKick = 1;                                          // 실제 이동폭보다 크게 보이도록 튕김 연출
    drawPanel(sub, inputIdx + ' / ' + sequence.length, '#b9aee0', 56);
    if (inputIdx >= sequence.length) {
      state = 'GOOD'; timer = 1.15;
      chord([659.25, 783.99, 1046.5]);
      drawPanel(hud, '맞았어요', '#4ecda4', 92);
      drawPanel(sub, '다음 레벨', '#b9aee0', 52);
    }
  } else {
    // 틀리면 즉시 종료가 아니라, 더 빨리 내려옵니다
    descY -= D.wrongDrop;
    descMul *= D.wrongMul;
    buzz(0.9, 150);
    tone(160, 0.4, 'sawtooth', 0.16);
    if (descY <= CFG.descEnd) { gameOver(true); return; }
    inputIdx = 0;
    state = 'SHOW'; playIdx = 0; timer = 0.9; litPad = -1;
    drawPanel(hud, '다시 볼게요', '#ff9d5c', 92);
    drawPanel(sub, '처음부터 따라 해요', '#b9aee0', 52);
  }
}

/* ============================================================
   11. 루프
   ============================================================ */
function loop(time, frame) {
  var dt = Math.min(clock.getDelta(), 0.05);
  var t = (time || 0) * 0.001;

  if (renderer.xr.isPresenting && !calibrated && frame) {
    settle -= dt;
    if (settle <= 0) {
      var refSpace = renderer.xr.getReferenceSpace();
      var pose = refSpace ? frame.getViewerPose(refSpace) : null;
      if (pose) {
        var pp = pose.transform.position, po = pose.transform.orientation;
        _q.set(po.x, po.y, po.z, po.w);
        _p.set(0, 0, -1).applyQuaternion(_q);
        var hx = _p.x, hz = _p.z;
        if (pp.y > 0.6 && Math.sqrt(hx*hx + hz*hz) > 0.12) {
          var sc = Math.max(CFG.minScale, Math.min(CFG.maxScale, pp.y / CFG.refEyeHeight));
          rig.scale.setScalar(sc);
          rig.position.set(pp.x, pp.y - CFG.padDrop * sc, pp.z);
          rig.rotation.y = Math.atan2(hx, hz);
          fitPoles();
          calibrated = true;
          say('cal', '보정', '눈높이 ' + pp.y.toFixed(2) + 'm · 배율 ' + sc.toFixed(2), 'ok');
        }
      }
    }
  }

  var tips = renderer.xr.isPresenting ? touchPoints() : [];

  if (CFG.debug && renderer.xr.isPresenting) {
    dbgTick += dt;
    if (dbgTick > 0.25) {
      dbgTick = 0;
      drawPanel(dbg, '입력 ' + dbgSrcs + ' · 컨트롤러 ' + dbgCtrls + ' · 손 ' + dbgHands +
        ' · 점 ' + tips.length, tips.length > 0 ? '#4ecda4' : '#ff7b8f', 44);
    }
  }

  var playing = (state === 'SHOW' || state === 'INPUT' || state === 'GOOD' ||
                 state === 'EXPAND' || state === 'INTRO');

  // 캐릭터 하강
  if (playing) {
    if (state !== 'INTRO') descY -= descSpeed() * dt;
    if (descY <= CFG.descEnd) { descY = CFG.descEnd; gameOver(true); }
  }

  if (state === 'SELECT') {
    for (var d = 0; d < 3; d++) {
      var dp = diffPads[d];
      dp.mat.emissiveIntensity = 0.30 + Math.sin(t * 2.6 + d * 0.8) * 0.22;
      if (checkTouch(dp, tips)) {
        dp.press = 1; dp.lit = 1;
        tone(660 + d * 120, 0.3); buzz(0.6, 80);
        startGame(dp.diff);
        break;
      }
    }

  } else if (state === 'INTRO' || state === 'EXPAND') {
    timer -= dt;
    if (timer <= 0) beginShow();

  } else if (state === 'SHOW') {
    timer -= dt;

    if (D.interfere && animal.power === 'spin' && spinAmt < 0.78) {
      var ds = dt * 0.34;
      padRing.rotation.y += ds; spinAmt += ds;
    }
    if (D.interfere && animal.power === 'dark') {
      darkAmt = Math.min(1, darkAmt + dt * 1.6);
      envLights.hemi.intensity = envLights.baseHemi * (1 - darkAmt * 0.72);
      envLights.key.intensity  = envLights.baseKey  * (1 - darkAmt * 0.78);
      envLights.fill.intensity = envLights.baseFill * (1 - darkAmt * 0.6);
    }
    if (blockT >= 0) {
      blockT += dt * 0.42;
      balloon.visible = blockT < 1;
      balloon.position.set(-1.5 + blockT * 3.0, 0.30 + Math.sin(blockT * 6) * 0.08, -0.46);
      if (blockT >= 1) blockT = 0;
    }

    if (timer <= 0) {
      if (litPad >= 0) {
        litPad = -1; timer = gapTime();
        if (playIdx >= sequence.length) toInput();
      } else {
        var lt = litTime();
        litPad = sequence[playIdx];
        pads[litPad].lit = 1; pads[litPad].press = 1;
        if (!muted()) tone(NOTES[litPad], lt * 0.9);
        playIdx++; timer = lt;
      }
    }

  } else if (state === 'INPUT') {
    timer -= dt;
    if (timer <= 0) {
      descY -= D.wrongDrop; descMul *= D.wrongMul;
      if (descY <= CFG.descEnd) { gameOver(true); }
      else { inputIdx = 0; state = 'SHOW'; playIdx = 0; timer = 0.9; litPad = -1;
             drawPanel(hud, '다시 볼게요', '#ff9d5c', 92); }
    } else {
      for (var i = 0; i < padCount; i++) {
        if (checkTouch(pads[i], tips)) { hitPad(i); break; }
      }
    }

  } else if (state === 'GOOD') {
    timer -= dt;
    if (timer <= 0) nextRound();

  } else if (state === 'OVER') {
    timer -= dt;
    if (timer <= 0) toSelect();
  }

  // 내려오는 캐릭터 위치와 줄 길이
  if (descGroup.visible) {
    descKick = Math.max(0, descKick - dt * 3.4);
    var shown = descY + descKick * 0.17;      // 눈에 보이는 높이 (튕김 포함)
    descGroup.position.y = shown;
    var ropeTop = 3.4;
    var rl = Math.max(0.1, ropeTop - shown);
    rope.scale.y = rl; rope.position.y = rl / 2 + 0.02;
    descGroup.rotation.y = Math.sin(t * 0.6) * 0.22;
    var danger = 1 - Math.max(0, Math.min(1, (descY - CFG.descEnd) / (CFG.descStart - CFG.descEnd)));
    animateAnimal(animalMesh, t, danger > 0.65 ? 'panic' : 'idle');
  }

  // 버튼 애니메이션
  for (var k = 0; k < 16; k++) {
    var p = pads[k];
    if (p.spawn < 1) {
      p.spawn += dt / CFG.spawnTime;
      var s01 = Math.max(0, Math.min(1, p.spawn));
      if (!p.rang && s01 > 0) { p.rang = true; riseSound(NOTES[k]); }
      var u = s01 - 1;
      p.unit.position.y = -CFG.spawnDrop * (1 - (1 + 2.70158*u*u*u + 1.70158*u*u));
    } else p.unit.position.y = 0;

    p.press = Math.max(0, p.press - dt * 5.0);
    p.inner.position.z = p.press * 0.028;
    p.lit = Math.max(0, p.lit - dt * 3.2);
    p.mat.color.copy(p.baseColor).multiplyScalar(0.50 + p.lit * 0.50);
    p.mat.emissiveIntensity = 0.05 + p.lit * 0.38;
    p.glow.material.opacity = p.lit * 0.95;
    p.beam.material.opacity = p.lit * 0.38;
    p.inner.scale.setScalar(1 + p.lit * 0.10);
  }
  for (var q = 0; q < 3; q++) {
    var dq = diffPads[q];
    dq.press = Math.max(0, dq.press - dt * 5.0);
    dq.inner.position.z = dq.press * 0.028;
    dq.lit = Math.max(0, dq.lit - dt * 3.2);
    dq.glow.material.opacity = dq.lit * 0.95;
  }

  renderer.render(scene, camera);
}

/* ============================================================
   12. PC 테스트
   ============================================================ */
function onPointer(e) {
  if (renderer.xr.isPresenting) return;
  initAudio();
  var m = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(m, camera);
  if (state === 'SELECT') {
    for (var d = 0; d < 3; d++) {
      if (ray.intersectObject(diffPads[d].group, true).length) {
        diffPads[d].press = 1; tone(660 + d * 120, 0.3); startGame(diffPads[d].diff); return;
      }
    }
    return;
  }
  if (state !== 'INPUT') return;
  for (var i = 0; i < padCount; i++) {
    if (ray.intersectObject(pads[i].group, true).length) { hitPad(i); return; }
  }
}
</script>
</body>
